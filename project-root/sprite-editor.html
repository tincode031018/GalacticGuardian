<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛸 Sprite Size Editor - Bắn Phi Thuyền</title>
<script src="src/spriteConfig.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: #030712;
        color: #e2e8f0;
        font-family: "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        padding-bottom: 40px;
    }

    header {
        position: sticky; top: 0; z-index: 50;
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
        padding: 12px 18px;
        background: rgba(3, 7, 18, 0.94);
        border-bottom: 1px solid #16324f;
        backdrop-filter: blur(6px);
    }
    header h1 {
        font-family: "Orbitron", "Segoe UI", sans-serif;
        font-size: 16px; letter-spacing: 2px; color: #00f0ff;
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        margin-right: auto;
    }
    header button, header a {
        border: 1px solid #16324f; background: #0b1a2e; color: #cfe8ff;
        padding: 8px 14px; border-radius: 8px; cursor: pointer;
        font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap;
        transition: all .15s;
    }
    header button:hover, header a:hover { background: #12324f; color: #fff; border-color: #00f0ff; }
    header button.accent { background: #00f0ff; color: #031018; border-color: #00f0ff; }
    header button.accent:hover { background: #7ffcff; }
    #status { flex-basis: 100%; font-size: 13px; color: #7dd3fc; min-height: 16px; }
    #status.ok { color: #4ade80; }
    #status.err { color: #f87171; }

    nav#tabs {
        display: flex; gap: 6px; padding: 12px 18px 0;
        flex-wrap: wrap;
    }
    nav#tabs button {
        border: 1px solid #16324f; background: #0b1a2e; color: #aac8e8;
        padding: 9px 18px; border-radius: 8px 8px 0 0; cursor: pointer;
        font-family: "Orbitron", sans-serif; font-size: 12px; letter-spacing: 1px;
    }
    nav#tabs button.active { background: #0e2138; color: #00f0ff; border-color: #00f0ff; }

    main { padding: 16px 18px; }
    section.tabpane { display: none; }
    section.tabpane.active { display: block; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

    .card {
        background: linear-gradient(160deg, #0b1a2e, #081627);
        border: 1px solid #16324f;
        border-radius: 12px;
        padding: 14px;
    }
    .card h3 {
        font-family: "Orbitron", sans-serif; font-size: 13px; letter-spacing: 1px;
        color: #7dd3fc; margin-bottom: 10px;
        display: flex; align-items: center; gap: 8px;
    }
    .card h3 small { font-family: "Segoe UI", sans-serif; color: #64748b; font-weight: 400; font-size: 11px; }

    .previews { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
    .pv {
        border: 1px dashed #1e3a5f; border-radius: 10px;
        padding: 8px; text-align: center; background:
            repeating-conic-gradient(#0b1524 0% 25%, #0f1f34 0% 50%) 0 0 / 16px 16px;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        min-width: 120px;
    }
    .pv .cap { font-size: 11px; color: #94a3b8; letter-spacing: 1px; }
    .pv .sz { font-size: 11px; color: #22d3ee; font-weight: 700; }
    .pv img { display: block; }
    .pv canvas { display: block; }

    .ctrl { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; margin-top: 4px; }
    .ctrl label { font-size: 12px; color: #b6cbe3; }
    .ctrl .num { width: 72px; background: #020617; color: #27e0ff; border: 1px solid #1e3a5f;
        padding: 5px 8px; border-radius: 6px; font-size: 13px; font-weight: 700; text-align: center; }
    .ctrl input[type=range] { width: 100%; grid-column: 1 / -1; accent-color: #00f0ff; }
    .color-row { display:flex; align-items:center; gap:10px; margin-top:8px; }
    .color-row label { font-size:12px; color:#b6cbe3; flex:1; }
    .color-row input[type=color] { width:52px; height:30px; padding:2px; border:1px solid #1e3a5f; border-radius:6px; background:#020617; cursor:pointer; }
    .color-value { width:82px; background:#020617; color:#27e0ff; border:1px solid #1e3a5f; padding:5px 7px; border-radius:6px; font:700 12px monospace; text-align:center; }
    .variant-tools { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:#b6cbe3; }
    .variant-tools input[type=color] { width:42px; height:26px; padding:2px; border:1px solid #1e3a5f; border-radius:5px; background:#020617; }
    .variant-tools input[type=number] { width:62px; background:#020617; color:#27e0ff; border:1px solid #1e3a5f; padding:4px; border-radius:5px; }
    .variant-tools button { margin-left:auto; border:1px solid #1e3a5f; background:#0b1a2e; color:#cfe8ff; padding:4px 8px; border-radius:5px; cursor:pointer; }
    /* Kích thước được chỉnh riêng trong từng thẻ sprite; giữ phần đầu chỉ cho màu. */
    #pane-player > .card:first-child .ctrl, #pane-enemy > .card:first-child .ctrl { display:none; }

    .note {
        font-size: 12px; color: #64748b; line-height: 1.6;
        border: 1px dashed #1e3a5f; border-radius: 10px; padding: 10px 12px; margin-top: 8px;
    }
    .note b { color: #93c5fd; }
</style>
</head>
<body>

<header>
    <h1>🛸 SPRITE SIZE EDITOR</h1>
    <button id="btn-reset" title="Khôi phục giá trị mặc định của game">↺ Mặc định</button>
    <button id="btn-load" title="Đọc sprite-sizes.json hiện tại">📂 Đọc cấu hình</button>
    <button id="btn-save" class="accent" title="Lưu ra file sprite-sizes.json (đặt cạnh index.html)">💾 Lưu sprite-sizes.json</button>
    <a id="btn-game" href="index.html" target="_blank" title="Mở game để xem kết quả">▶ Mở game</a>
    <div id="status">Sẵn sàng. Thay đổi sẽ áp dụng cho lần tải game TIẾP THEO.</div>
</header>

<nav id="tabs">
    <button data-tab="player" class="active">🛩️ Phi Thuyền</button>
    <button data-tab="enemy">👾 Quân Địch</button>
    <button data-tab="boss">👹 Boss</button>
    <button data-tab="other">☄️ Phụ Trợ</button>
</nav>

<main>
    <!-- ============================ PHI THUYỀN ============================ -->
    <section class="tabpane active" id="pane-player">
        <div class="card" style="margin-bottom:14px">
            <h3>⚙️ Kích thước chung (áp dụng cho cả 3 phi thuyền)</h3>
            <div class="ctrl">
                <label>Phi thuyền — chiều cao trên MÀN DỌC (px)</label><input type="number" class="num" data-cat="player" data-key="portraitHeight" min="20" max="200" step="1">
                <input type="range" data-cat="player" data-key="portraitHeight" min="20" max="200" step="1">
                <label>Phi thuyền — chiều rộng trên MÀN NGANG (px)</label><input type="number" class="num" data-cat="player" data-key="landscapeWidth" min="20" max="200" step="1">
                <input type="range" data-cat="player" data-key="landscapeWidth" min="20" max="200" step="1">
                <label>Preview trong menu — chiều cao (px)</label><input type="number" class="num" data-cat="player" data-key="menuPortraitHeight" min="30" max="220" step="1">
                <input type="range" data-cat="player" data-key="menuPortraitHeight" min="30" max="220" step="1">
                <label>Preview trong menu — chiều rộng (px)</label><input type="number" class="num" data-cat="player" data-key="menuLandscapeWidth" min="40" max="300" step="1">
                <input type="range" data-cat="player" data-key="menuLandscapeWidth" min="40" max="300" step="1">
            </div>
            <div class="color-row"><label>Màu phủ sprite (áp dụng cả 3 phi thuyền)</label><input type="color" data-cat="player" data-key="tint"><input class="color-value" data-cat="player" data-key="tint" maxlength="7"></div>
        </div>

        <div class="grid" id="player-grid"></div>
    </section>

    <!-- ============================ QUÂN ĐỊCH ============================ -->
    <section class="tabpane" id="pane-enemy">
        <div class="card" style="margin-bottom:14px">
            <h3>⚙️ Kích thước chung (áp dụng cho enemy1 / enemy2 / enemy3)</h3>
            <div class="ctrl">
                <label>Quân địch — chiều cao trên MÀN DỌC (px)</label><input type="number" class="num" data-cat="enemy" data-key="portraitHeight" min="20" max="200" step="1">
                <input type="range" data-cat="enemy" data-key="portraitHeight" min="20" max="200" step="1">
                <label>Quân địch — chiều rộng trên MÀN NGANG (px)</label><input type="number" class="num" data-cat="enemy" data-key="landscapeWidth" min="20" max="200" step="1">
                <input type="range" data-cat="enemy" data-key="landscapeWidth" min="20" max="200" step="1">
            </div>
            <div class="color-row"><label>Màu phủ sprite (áp dụng cả 3 loại địch)</label><input type="color" data-cat="enemy" data-key="tint"><input class="color-value" data-cat="enemy" data-key="tint" maxlength="7"></div>
        </div>
        <div class="grid" id="enemy-grid"></div>
    </section>

    <!-- ============================ BOSS ============================ -->
    <section class="tabpane" id="pane-boss">
        <div class="card" style="margin-bottom:14px"><div class="color-row"><label>Màu phủ boss mặc định (Round 1 &amp; 3)</label><input type="color" data-cat="boss" data-key="tint"><input class="color-value" data-cat="boss" data-key="tint" maxlength="7"></div><div class="note">Boss Round 2 giữ màu đỏ/xanh riêng để phân biệt hai boss.</div></div><div class="grid" id="boss-grid"></div>
    </section>

    <!-- ============================ PHỤ TRỢ ============================ -->
    <section class="tabpane" id="pane-other">
        <div class="grid" id="other-grid"></div>
    </section>
</main>
<script>
"use strict";

let state = deepClone(window.SPRITE_DEFAULTS);
let defaults = deepClone(window.SPRITE_DEFAULTS);

/* ---------------- helper ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function setStatus(msg, type) {
    const el = $('#status');
    el.textContent = msg;
    el.className = type || '';
}

function bumpState(cat, key, val) {
    if (!state[cat]) state[cat] = {};
    state[cat][key] = key === 'tint' ? normalizeColor(val) : Number(val);
    refreshAll();
}

function normalizeColor(value) {
    const v = String(value || '').trim();
    return /^#[0-9a-f]{6}$/i.test(v) ? v.toLowerCase() : '#ffffff';
}

function tintFilter(hex) {
    const normalized = normalizeColor(hex);
    if (normalized === '#ffffff') return 'none';
    const n = parseInt(normalized.slice(1), 16);
    const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b); let h=0;
    if(max!==min){const d=max-min; h=max===r?60*((g-b)/d%6):max===g?60*((b-r)/d+2):60*((r-g)/d+4); if(h<0)h+=360;}
    return `sepia(1) saturate(5) hue-rotate(${Math.round(h-35)}deg)`;
}

function makeVariantTools(cat, variant) {
    const d = document.createElement('div'); d.className = 'variant-tools';
    d.innerHTML = '<span>Màu</span><input type="color"><span>Đạn</span><input type="color"><span>Động cơ</span><input type="color"><span>Xoay°</span><input type="number" min="-180" max="180" step="1"><label><input type="checkbox"> Lật X</label><label><input type="checkbox"> Lật Y</label><button type="button">Đặt lại</button>';
    const cfg = () => (state[cat].variants || (state[cat].variants = {}))[variant] || (state[cat].variants[variant] = {tint:'#ffffff',rotation:0,flipX:false,flipY:false});
    const colors=d.querySelectorAll('input[type=color]'), color=colors[0], bulletColor=colors[1], engineColor=colors[2], rot=d.querySelector('input[type=number]'), [flipX,flipY]=d.querySelectorAll('input[type=checkbox]'), reset=d.querySelector('button');
    const sync = () => { const c=cfg(); color.value=normalizeColor(c.tint); bulletColor.value=normalizeColor(c.bulletTint); engineColor.value=normalizeColor(c.engineTint); rot.value=Number(c.rotation)||0; flipX.checked=!!c.flipX; flipY.checked=!!c.flipY; };
    color.oninput=()=>{cfg().tint=color.value; refreshAll();}; bulletColor.oninput=()=>{cfg().bulletTint=bulletColor.value;}; engineColor.oninput=()=>{cfg().engineTint=engineColor.value;}; rot.oninput=()=>{cfg().rotation=Number(rot.value)||0; refreshAll();}; flipX.onchange=()=>{cfg().flipX=flipX.checked; refreshAll();}; flipY.onchange=()=>{cfg().flipY=flipY.checked; refreshAll();}; reset.onclick=()=>{state[cat].variants[variant]={tint:'#ffffff',bulletTint:'#ffffff',engineTint:'#ffffff',rotation:0,flipX:false,flipY:false}; sync(); refreshAll();};
    d._sync=sync; sync(); return d;
}

function portraitImg(src, label) {
    const div = document.createElement('div');
    div.className = 'pv';
    div.innerHTML = '<span class="cap">' + label + '</span><img alt="" loading="lazy"><span class="sz"></span>';
    const img = div.querySelector('img');
    img.src = src;
    img.dataset.kind = 'portrait';
    return div;
}

function landscapeImg(src, label) {
    const div = document.createElement('div');
    div.className = 'pv';
    div.innerHTML = '<span class="cap">' + label + '</span><img alt="" loading="lazy"><span class="sz"></span>';
    const img = div.querySelector('img');
    img.src = src;
    img.dataset.kind = 'landscape';
    return div;
}

function canvasPv(label, stateKey) {
    const div = document.createElement('div');
    div.className = 'pv';
    div.innerHTML = '<span class="cap">' + label + '</span><canvas width="96" height="96"></canvas><span class="sz"></span>';
    div.querySelector('canvas').dataset.kind = stateKey;
    return div;
}

function makeCard(title, sub, body) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<h3>' + title + (sub ? ' <small>' + sub + '</small>' : '') + '</h3>';
    card.appendChild(body);
    return card;
}

/* ---------------- preview refresh ---------------- */
function applyPreview(el, w, h, isPortrait) {
    if (isPortrait) {
        el.style.width = 'auto';
        el.style.height = h + 'px';
    } else {
        el.style.width = w + 'px';
        el.style.height = 'auto';
    }
    const cap = el.parentElement.querySelector('.sz');
    if (cap) cap.textContent = Math.round(w || 0) + ' × ' + Math.round(h || 0) + ' px';
}

function drawMeteorPv(canvas) {
    const size = state.meteor.sizeMax || 58;
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.height = 96;
    const cx = 48, cy = 48;
    const scale = (size / 58) * 1.7;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    const g = ctx.createRadialGradient(0, -8, 2, 0, 0, 26);
    g.addColorStop(0, '#b8a894'); g.addColorStop(0.45, '#8a7a68'); g.addColorStop(0.8, '#55483c'); g.addColorStop(1, '#2e2620');
    ctx.fillStyle = g;
    ctx.beginPath();
    [[-14,-7],[8,-13],[20,-2],[15,13],[2,21],[-13,15],[-20,2]].forEach(([x,y],i)=>{
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(40,32,26,0.75)';
    [[-5,-4,4],[6,4,5],[-1,9,3],[11,-2,3]].forEach(([x,y,r])=>{
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    });
    ctx.restore();
    const cap = canvas.parentElement.querySelector('.sz');
    if (cap) cap.textContent = 'Ngang ' + state.meteor.sizeMin + ' → ' + state.meteor.sizeMax + ' px';
}

function drawShieldPv(canvas) {
    const size = state.shield.size || 95;
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.height = 96;
    const cx = 48, cy = 48;
    const r = Math.max(20, Math.min(46, 46 * (size / 95)));
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, r);
    g.addColorStop(0, 'rgba(255,255,255,0.9)');
    g.addColorStop(0.3, 'rgba(0,240,255,0.55)');
    g.addColorStop(0.75, 'rgba(0,119,255,0.25)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(0,240,255,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.9, 0, Math.PI * 2); ctx.stroke();
    const cap = canvas.parentElement.querySelector('.sz');
    if (cap) cap.textContent = size + ' px';
}

function refreshAll() {
    for (let n = 1; n <= 3; n++) {
        const wrap = document.getElementById('pv-player-' + n);
        if (wrap) {
            const po = wrap.querySelector('.pv img[data-kind=portrait]');
            const la = wrap.querySelector('.pv img[data-kind=landscape]');
            if (po) applyPreview(po, 0, state.player['player' + n + 'PortraitHeight'], true);
            if (la) applyPreview(la, state.player['player' + n + 'LandscapeWidth'], 0, false);
            const tint = state.player.variants?.['player' + n]?.tint || '#ffffff';
            if (po) po.style.filter = tintFilter(tint); if (la) la.style.filter = tintFilter(tint);
        }
    }
    for (let n = 1; n <= 3; n++) {
        const wrap = document.getElementById('pv-enemy-' + n);
        if (wrap) {
            const po = wrap.querySelector('.pv img[data-kind=portrait]');
            const la = wrap.querySelector('.pv img[data-kind=landscape]');
            if (po) applyPreview(po, 0, state.enemy['enemy' + n + 'PortraitHeight'], true);
            if (la) applyPreview(la, state.enemy['enemy' + n + 'LandscapeWidth'], 0, false);
            const tint = state.enemy.variants?.['enemy' + n]?.tint || '#ffffff';
            if (po) po.style.filter = tintFilter(tint); if (la) la.style.filter = tintFilter(tint);
        }
    }
    const bossMap = {
        'boss-r1': { p: 'round1Portrait', l: 'round1Landscape' },
        'boss-r2r': { p: 'round2RedPortrait', l: 'round2RedLandscape' },
        'boss-r2g': { p: 'round2GreenPortrait', l: 'round2GreenLandscape' },
        'boss-r3': { p: 'round3Portrait', l: 'round3Landscape' }
    };
    for (const id in bossMap) {
        const wrap = document.getElementById('pv-' + id);
        if (!wrap) continue;
        const po = wrap.querySelector('.pv img[data-kind=portrait]');
        const la = wrap.querySelector('.pv img[data-kind=landscape]');
        if (po) applyPreview(po, 0, state.boss[bossMap[id].p], true);
        if (la) applyPreview(la, state.boss[bossMap[id].l], 0, false);
        const variant = ({'boss-r1':'round1','boss-r2r':'round2Red','boss-r2g':'round2Green','boss-r3':'round3'})[id];
        const tint = state.boss.variants?.[variant]?.tint || '#ffffff';
        if (po) po.style.filter = tintFilter(tint); if (la) la.style.filter = tintFilter(tint);
    }
    const satWrap = document.getElementById('pv-satellite');
    if (satWrap) {
        const img = satWrap.querySelector('.pv img');
        if (img) applyPreview(img, state.satellite.size, 0, false);
    }
    $$('canvas[data-kind=meteor]').forEach(drawMeteorPv);
    $$('canvas[data-kind=shield]').forEach(drawShieldPv);

    $$('.ctrl input[data-cat]').forEach(inp => {
        const cat = inp.dataset.cat, key = inp.dataset.key;
        const v = state[cat] && state[cat][key] !== undefined ? state[cat][key] : defaults[cat][key];
        if (String(inp.value) !== String(v)) inp.value = v;
    });
    $$('.color-row input[data-cat]').forEach(inp => {
        const cat = inp.dataset.cat, key = inp.dataset.key;
        const v = normalizeColor(state[cat] && state[cat][key] !== undefined ? state[cat][key] : defaults[cat][key]);
        if (inp.value !== v) inp.value = v;
    });
    $$('.variant-tools').forEach(d => d._sync && d._sync());
}
/* ---------------- build UI ---------------- */
function makeCtrlRow(label, cat, key, min, max) {
    const d = document.createElement('div');
    d.className = 'ctrl';
    d.innerHTML =
        '<label>' + label + '</label><input type="number" class="num" data-cat="' + cat + '" data-key="' + key + '" min="' + min + '" max="' + max + '" step="1">' +
        '<input type="range" data-cat="' + cat + '" data-key="' + key + '" min="' + min + '" max="' + max + '" step="1">';
    const num = d.querySelector('input[type=number]');
    const rng = d.querySelector('input[type=range]');
    const sync = () => {
        const v = state[cat] && state[cat][key] !== undefined ? state[cat][key] : defaults[cat][key];
        num.value = rng.value = v;
    };
    num.addEventListener('input', () => bumpState(cat, key, num.value));
    rng.addEventListener('input', () => bumpState(cat, key, rng.value));
    d._sync = sync;
    return d;
}

function shipCard(n, names) {
    const wrap = document.createElement('div');
    wrap.id = 'pv-player-' + n;
    wrap.style.display = 'contents';
    const po = portraitImg('assets/phithuyen/player' + n + 'a.png', 'MÀN DỌC (round 1-2)');
    const la = landscapeImg('assets/phithuyen/player' + n + 'b.png', 'MÀN NGANG (round 3)');
    const previews = document.createElement('div');
    previews.className = 'previews';
    previews.appendChild(po); previews.appendChild(la);
    wrap.appendChild(previews);
    wrap.appendChild(makeCtrlRow('Portrait riêng (px)', 'player', 'player' + n + 'PortraitHeight', 20, 200));
    wrap.appendChild(makeCtrlRow('Landscape riêng (px)', 'player', 'player' + n + 'LandscapeWidth', 20, 300));
    wrap.appendChild(makeVariantTools('player', 'player' + n));
    return makeCard('🛸 CHIẾN HẠM P' + n, names[n], wrap);
}

function enemyCard(n) {
    const wrap = document.createElement('div');
    wrap.id = 'pv-enemy-' + n;
    wrap.style.display = 'contents';
    const po = portraitImg('assets/phithuyen/enemy' + n + 'a.png', 'MÀN DỌC');
    const la = landscapeImg('assets/phithuyen/enemy' + n + 'b.png', 'MÀN NGANG');
    const previews = document.createElement('div');
    previews.className = 'previews';
    previews.appendChild(po); previews.appendChild(la);
    wrap.appendChild(previews);
    wrap.appendChild(makeCtrlRow('Portrait riêng (px)', 'enemy', 'enemy' + n + 'PortraitHeight', 20, 200));
    wrap.appendChild(makeCtrlRow('Landscape riêng (px)', 'enemy', 'enemy' + n + 'LandscapeWidth', 20, 300));
    wrap.appendChild(makeVariantTools('enemy', 'enemy' + n));
    const sub = n === 3 ? 'Fireball · trâu nhất' : (n === 2 ? 'Bắn ngắm · máu khá' : 'Lính thường');
    return makeCard('👾 KẺ THÙ ' + n, sub, wrap);
}
function bossCard(id, title, sub, imgA, imgB, keys) {
    const wrap = document.createElement('div');
    wrap.id = 'pv-' + id;
    wrap.style.display = 'contents';
    const po = portraitImg(imgA, 'MÀN DỌC');
    const la = landscapeImg(imgB, 'MÀN NGANG');
    const previews = document.createElement('div');
    previews.className = 'previews';
    previews.appendChild(po); previews.appendChild(la);
    wrap.appendChild(previews);
    wrap.appendChild(makeCtrlRow('Chiều cao MÀN DỌC (px)', 'boss', keys.p, 40, 600));
    wrap.appendChild(makeCtrlRow('Chiều rộng MÀN NGANG (px)', 'boss', keys.l, 40, 600));
    wrap.appendChild(makeVariantTools('boss', keys.v));
    return makeCard(title, sub, wrap);
}

function buildPlayerGrid() {
    const grid = $('#player-grid');
    grid.innerHTML = '';
    const names = { 1: 'Alpha · Tia Laze', 2: 'Phantom · Sét', 3: 'Vầng Nguyệt · Lưỡi Liềm' };
    for (let n = 1; n <= 3; n++) grid.appendChild(shipCard(n, names));
}

function buildEnemyGrid() {
    const grid = $('#enemy-grid');
    grid.innerHTML = '';
    for (let n = 1; n <= 3; n++) grid.appendChild(enemyCard(n));
}

function buildBossGrid() {
    const grid = $('#boss-grid');
    grid.innerHTML = '';
    grid.appendChild(bossCard('boss-r1', '👹 BOSS ROUND 1', 'Titan Warship', 'assets/phithuyen/boss1a.png', 'assets/phithuyen/boss1b.png',
        { p: 'round1Portrait', l: 'round1Landscape', v: 'round1' }));
    grid.appendChild(bossCard('boss-r2r', '🔴 BOSS ROUND 2', 'Tử Thần Đỏ', 'assets/phithuyen/boss2a.png', 'assets/phithuyen/boss2b.png',
        { p: 'round2RedPortrait', l: 'round2RedLandscape', v: 'round2Red' }));
    grid.appendChild(bossCard('boss-r2g', '💚 BOSS ROUND 2', 'Cyber Medic Xanh', 'assets/phithuyen/boss2a.png', 'assets/phithuyen/boss2b.png',
        { p: 'round2GreenPortrait', l: 'round2GreenLandscape', v: 'round2Green' }));
    grid.appendChild(bossCard('boss-r3', '☠️ BOSS ROUND 3', 'Omega Annihilator', 'assets/phithuyen/boss2a.png', 'assets/phithuyen/boss2b.png',
        { p: 'round3Portrait', l: 'round3Landscape', v: 'round3' }));
}
function buildOtherGrid() {
    const grid = $('#other-grid');
    grid.innerHTML = '';
    const roundCard = document.createElement('div');
    roundCard.className = 'card';
    roundCard.innerHTML = '<h3>⚙️ CẤU HÌNH TỪNG ROUND</h3><div class="note">Số quái là số xuất hiện trong mỗi wave. Tỷ lệ hồn ngọc tính theo phần trăm.</div>';
    for (let r = 1; r <= 3; r++) {
        roundCard.appendChild(document.createElement('hr'));
        roundCard.appendChild(document.createElement('h3')).textContent = 'ROUND ' + r;
        roundCard.appendChild(makeCtrlRow('Số wave', 'rounds', 'round' + r + 'Waves', 1, 100));
        roundCard.appendChild(makeCtrlRow('Số quái mỗi wave', 'rounds', 'round' + r + 'Enemies', 1, 30));
        roundCard.appendChild(makeCtrlRow('Tỷ lệ rơi hồn ngọc (%)', 'rounds', 'round' + r + 'OrbDrop', 0, 100));
    }
    grid.appendChild(roundCard);
    const mk = (id, title, sub, pv, rows) => {
        const wrap = document.createElement('div');
        wrap.id = id;
        wrap.style.display = 'contents';
        const previews = document.createElement('div');
        previews.className = 'previews';
        previews.appendChild(pv);
        wrap.appendChild(previews);
        rows.forEach(r => wrap.appendChild(r));
        grid.appendChild(makeCard(title, sub, wrap));
    };

    const metPv = canvasPv('THIÊN THẠCH', 'meteor');
    mk('pv-meteor', '☄️ THIÊN THẠCH (round 3)', 'Kích thước ngẫu nhiên trong khoảng',
        metPv,
        [makeCtrlRow('Nhỏ nhất (px)', 'meteor', 'sizeMin', 10, 150),
         makeCtrlRow('Lớn nhất (px)', 'meteor', 'sizeMax', 10, 150)]);

    const satPv = landscapeImg('assets/vatthe/vetinh.png', 'VỆ TINH');
    mk('pv-satellite', '🛰️ VỆ TINH BỊ BẮN', 'Texture assets/vatthe/vetinh.png',
        satPv,
        [makeCtrlRow('Kích thước (px)', 'satellite', 'size', 20, 200)]);

    const shPv = canvasPv('KHIÊN ĐIỆN', 'shield');
    mk('pv-shield', '🛡️ KHIÊN ĐIỆN PHẢN ĐÒN', 'Tự tạo từ particle_glow',
        shPv,
        [makeCtrlRow('Kích thước (px)', 'shield', 'size', 20, 250)]);

    const note = document.createElement('div');
    note.className = 'note';
    note.innerHTML = 'ℹ️ Các đạn như <b>LƯỠI LIỀM, TIA LAZE, CẦU LỬA</b> được vẽ bằng code trong <b>src/preload.js</b> — để chỉnh kích thước các loại đạn, hãy sửa trực tiếp trong mã nguồn (hoặc nhờ hỗ trợ thêm).';
    grid.appendChild(note);
}
/* ---------------- tabs ---------------- */
function switchTab(name) {
    $$('nav#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    $$('section.tabpane').forEach(s => s.classList.toggle('active', s.id === 'pane-' + name));
}
$$('nav#tabs button').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

/* ---------------- actions ---------------- */
async function saveConfig() {
    const json = JSON.stringify(state, null, 2);
    let saved = false;
    try {
        if (window.showSaveFilePicker) {
            const handle = await window.showSaveFilePicker({
                suggestedName: 'sprite-sizes.json',
                types: [{ description: 'Cấu hình sprite JSON', accept: { 'application/json': ['.json'] } }]
            });
            const writable = await handle.createWritable();
            await writable.write(json);
            await writable.close();
            setStatus('✓ Đã lưu: ' + handle.name + ' — Ấn mở game & F5 để xem kết quả!', 'ok');
            saved = true;
        }
    } catch (e) {
        if (e && e.name === 'AbortError') return;
    }
    if (!saved) {
        const blob = new Blob([json], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'sprite-sizes.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        setStatus('↓ Đã tải sprite-sizes.json — đặt file CẠNH index.html rồi chơi lại.', 'ok');
    }
}

async function loadConfigFile() {
    try {
        const res = await fetch('sprite-sizes.json', { cache: 'no-store' });
        if (res.ok) {
            const saved = await res.json();
            state = deepMerge(deepClone(defaults), saved);
            setStatus('✓ Đã nạp sprite-sizes.json', 'ok');
        } else {
            setStatus('Không tìm thấy sprite-sizes.json — đang dùng mặc định.', 'err');
        }
    } catch (e) {
        setStatus('Không nạp được (file://) — dùng mặc định. Dùng http://localhost:8123/sprite-editor.html để nạp tự động.', 'err');
    }
    refreshAll();
}

function resetConfig() {
    state = deepClone(defaults);
    refreshAll();
    setStatus('↺ Đã khôi phục mặc định (bấm 💾 để lưu file).');
}

$('#btn-save').addEventListener('click', saveConfig);
$('#btn-load').addEventListener('click', loadConfigFile);
$('#btn-reset').addEventListener('click', resetConfig);

/* ---------------- init ---------------- */
function bindStaticControls() {
    $$('.ctrl input[data-cat]').forEach(inp => {
        const cat = inp.dataset.cat, key = inp.dataset.key;
        if (!cat || !key) return;
        if (inp._bound) return;
        inp._bound = true;
        inp.addEventListener('input', () => bumpState(cat, key, inp.value));
    });
}

$$('.color-row input[data-cat]').forEach(inp => {
    inp.addEventListener(inp.type === 'color' ? 'input' : 'change', () => {
        const cat = inp.dataset.cat, key = inp.dataset.key;
        bumpState(cat, key, inp.value);
    });
});

(async function init() {
    buildPlayerGrid();
    buildEnemyGrid();
    buildBossGrid();
    buildOtherGrid();
    bindStaticControls();
    await loadConfigFile();
    refreshAll();
})();
</script>
